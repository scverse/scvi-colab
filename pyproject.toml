[build-system]
build-backend = "poetry.masonry.api"
requires = [
  "poetry>=1,<2",
  "setuptools",   # keep it here or "pip install -e" would fail
]

[tool.poetry]
name = "scvi-colab"
version = "0.15.0"
description = "Lightweight helper to install scvi-tools in Google Colab."
license = "BSD-3-Clause"
authors = [ "The scvi-tools development team <ori.kronfeld@weizmann.ac.il>" ]
readme = "README.md"
homepage = "https://github.com/scverse/scvi-colab"
documentation = "https://scvi-tools.org"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
packages = [
  { include = "scvi_colab" },
]
dependencies.python = ">=3.12,<4.0"
dependencies.importlib-metadata = { version = ">=8.0.0", python = "<3.13" }
dependencies.pre-commit = { version = ">=4.0.0", optional = true }
dependencies.pynndescent = { version = ">=0.5.11", optional = true }
dependencies.pytest = { version = ">=8.0.0", optional = true }
dependencies.pytest-cov = { version = ">=5.0.0", optional = true }
dependencies.rich = "*"
dependencies.ruff = { version = ">=0.16.0", optional = true }
dependencies.scanpy = { version = ">=1.10", optional = true }
dependencies.setuptools = { version = ">=75.0.0", optional = true }
extras.dev = [ "pre-commit", "pynndescent", "pytest", "pytest-cov", "ruff", "scanpy", "setuptools" ]

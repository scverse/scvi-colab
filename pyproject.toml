[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "scvi-colab"
version = "0.15.0"
description = "Lightweight helper to install scvi-tools in Google Colab."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "The scvi-tools development team", email = "ori.kronfeld@weizmann.ac.il" },
]
requires-python = ">=3.12,<4.0"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "importlib-metadata>=8; python_version<'3.13'",
  "rich",
]
optional-dependencies.dev = [
  "pre-commit>=4",
  "pynndescent>=0.5.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
  "scanpy>=1.10",
]
urls.Documentation = "https://scvi-tools.org"
urls.Homepage = "https://github.com/scverse/scvi-colab"

[tool.hatch]
build.targets.wheel.packages = [ "scvi_colab" ]
